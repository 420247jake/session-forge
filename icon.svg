<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="forge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Anvil body -->
  <path d="M140 340 L372 340 L392 370 L120 370 Z" fill="#4b5563" stroke="#6b7280" stroke-width="2"/>
  <rect x="180" y="370" width="152" height="30" rx="4" fill="#374151"/>
  <rect x="160" y="400" width="192" height="16" rx="4" fill="#4b5563"/>

  <!-- Anvil top (horn + face) -->
  <path d="M100 310 Q100 290 130 290 L170 290 L170 340 L140 340 Z" fill="#6b7280" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="170" y="280" width="172" height="60" rx="6" fill="#6b7280" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- Hammer -->
  <g filter="url(#shadow)">
    <!-- Handle -->
    <rect x="240" y="100" width="12" height="140" rx="4" fill="#92400e" transform="rotate(-25 246 170)"/>
    <!-- Head -->
    <rect x="200" y="80" width="90" height="45" rx="8" fill="#d97706" stroke="#f59e0b" stroke-width="2" transform="rotate(-25 245 102)"/>
  </g>

  <!-- Sparks / forge glow -->
  <circle cx="256" cy="280" r="6" fill="#fbbf24" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="230" cy="260" r="4" fill="#fb923c" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="265" r="5" fill="#fbbf24" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="245" r="3" fill="#fde68a" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="270" cy="250" r="3.5" fill="#fb923c" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Memory nodes (brain/network concept) -->
  <g opacity="0.85">
    <!-- Node connections -->
    <line x1="340" y1="150" x2="380" y2="190" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
    <line x1="380" y1="190" x2="410" y2="160" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
    <line x1="380" y1="190" x2="400" y2="230" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
    <line x1="340" y1="150" x2="370" y2="120" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>

    <!-- Nodes -->
    <circle cx="340" cy="150" r="8" fill="#0ea5e9" stroke="#38bdf8" stroke-width="2">
      <animate attributeName="r" values="8;9;8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="190" r="6" fill="#0ea5e9" stroke="#38bdf8" stroke-width="2">
      <animate attributeName="r" values="6;7;6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="410" cy="160" r="5" fill="#0ea5e9" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="400" cy="230" r="5" fill="#0ea5e9" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="370" cy="120" r="5" fill="#0ea5e9" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Text: SF -->
  <text x="256" y="470" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="42" fill="#e5e7eb" letter-spacing="4">SESSION FORGE</text>
</svg>
